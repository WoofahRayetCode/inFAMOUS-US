name: Setup app

on:
  push:
    branches: ['**']
  pull_request:
    paths:
      - ".github/workflows/setup-app.yml"
      - "installer/**"
      - "infamous-recomp/**"
      - "ps3recomp/**"
      - "sdl3/**"
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish this default-branch build as the stable release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.package.outputs.channel }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache-workspaces: installer

      - name: Check formatting
        run: cargo fmt --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rust regressions
        run: cargo test --locked

      - name: Native regressions and regional synchronization
        shell: pwsh
        run: |
          if (-not (Get-Command cl -ErrorAction SilentlyContinue) -or -not (Get-Command clang -ErrorAction SilentlyContinue)) { throw 'Native tests require cl and clang' }
          if (-not (Test-Path ../sdl3/lib/x64/SDL3.dll)) { throw 'SDL3 runtime missing' }
          python regions/BCUS98119/tools/check_sync.py ..
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/validation -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cargo build --release --locked

      - name: Package standalone Setup
        id: package
        working-directory: .
        shell: pwsh
        env:
          BUILD_CHANNEL: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable &&
                github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
                'stable' || 'bleeding-edge' }}
        run: |
          [IO.File]::WriteAllText((Join-Path $PWD 'installer/build-channel'), "$env:BUILD_CHANNEL`n", [Text.Encoding]::ASCII)
          installer/target/release/infamous-installer.exe package --root . --out "dist/inFamous Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "channel=$env:BUILD_CHANNEL" >> $env:GITHUB_OUTPUT

      - name: Test packaged Python without system Python on PATH
        shell: pwsh
        env:
          INFAMOUS_TEST_BUILD_CHANNEL: ${{ steps.package.outputs.channel }}
        run: |
          $env:INFAMOUS_TEST_SETUP = (Resolve-Path '../dist/inFamous Setup.exe').Path
          $env:INFAMOUS_TEST_RELEASE_BIN = (Resolve-Path 'target/release').Path
          cargo test --release --locked --test packaged_python -- --ignored

      - uses: actions/upload-artifact@v4
        with:
          name: inFamous-Setup
          path: dist/inFamous Setup.exe
          if-no-files-found: error
          overwrite: true

      - uses: actions/upload-artifact@v4
        with:
          name: infamous-installer
          path: |
            installer/target/release/infamous-installer.exe
            installer/target/release/infamous-setup.exe
            installer/target/release/infamous-launch.exe
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish Setup and updater release
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: infamous-installer
          path: ${{ runner.temp }}/updater-binaries

      - uses: actions/download-artifact@v4
        with:
          name: inFamous-Setup
          path: ${{ runner.temp }}/setup

      - name: Publish tested Setup, installer, and launcher
        shell: bash
        env:
          BUILD_CHANNEL: ${{ needs.build.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BUILD_CHANNEL" in
            stable)
              tag=$(date -u +v%Y%m%d.%H%M%SZ)
              flags=(--latest)
              ;;
            bleeding-edge)
              tag="bleeding-edge-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
              flags=(--prerelease --latest=false)
              ;;
            *)
              echo "Unexpected build channel: $BUILD_CHANNEL" >&2
              exit 1
              ;;
          esac

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          artifact="$RUNNER_TEMP/updater-binaries"
          setup="$RUNNER_TEMP/setup/inFamous-Setup.exe"
          test -s "$artifact/infamous-installer.exe"
          test -s "$artifact/infamous-launch.exe"
          test -s "$RUNNER_TEMP/setup/inFamous Setup.exe"
          mv "$RUNNER_TEMP/setup/inFamous Setup.exe" "$setup"
          mkdir -p installer/bin
          cp "$artifact/infamous-installer.exe" "$artifact/infamous-launch.exe" installer/bin/
          printf '%s\n' "$BUILD_CHANNEL" > installer/build-channel
          git add -- installer/build-channel installer/bin/infamous-installer.exe installer/bin/infamous-launch.exe

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "Distribute $BUILD_CHANNEL build $GITHUB_SHA"
          for binary in infamous-installer.exe infamous-launch.exe; do
            test "$(git rev-parse "HEAD:installer/bin/$binary")" = "$(git hash-object --no-filters "$artifact/$binary")"
          done

          # Push only a new tag. The distribution commit stays off the default branch.
          git push origin "HEAD:refs/tags/$tag"
          gh release create "$tag" "$setup" --verify-tag "${flags[@]}" \
            --title "$tag" \
            --notes "Built from $GITHUB_SHA by [Setup app run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
